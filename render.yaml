services:
  - type: web
    name: davood-hunter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PAPER_MODE
        value: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
